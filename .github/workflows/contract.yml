name: Contract CI

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stellar/actions/soroban@v0
        with:
          version: "22"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.84.0"
          target: wasm32v1-none
      - run: cargo test --workspace --release
      - run: cargo build --release -p energy_gateway --target wasm32v1-none
