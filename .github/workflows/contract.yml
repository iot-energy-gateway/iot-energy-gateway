name: Contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32v1-none
      - run: cargo check -p energy_gateway
      - run: cargo build --release -p energy_gateway --target wasm32v1-none
        env:
          RUSTFLAGS: "-C link-arg=--gc-sections"
